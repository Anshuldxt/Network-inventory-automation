services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-network_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-network_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [appnet]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-network_inventory}
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./data:/data
      - ./logs:/logs
    depends_on:
      db: {condition: service_healthy}
    networks: [appnet]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on: [backend]
    networks: [appnet]
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-network_inventory}
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data:/data
      - ./logs:/logs
    depends_on:
      db: {condition: service_healthy}
    networks: [appnet]
volumes:
  postgres_data:
networks:
  appnet:
